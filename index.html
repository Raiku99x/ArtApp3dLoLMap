<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>3D MOBA Map</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e1a24;--fg:#e8f1f8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
.l{position:absolute;z-index:1;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:#000a;border:1px solid transparent;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;white-space:nowrap;transition:opacity .25s,box-shadow .2s,border-color .2s,background .2s;-webkit-user-select:none;user-select:none}
.l:hover{border-color:#9be6f7;background:#0b1c28ee;box-shadow:0 0 10px #4cc9e6}
.l.b{border-left:3px solid #5aa9ff}.l.r{border-left:3px solid #ff6a5f}
.l.m,.l.m.b,.l.m.r{font-size:0;padding:0;width:10px;height:10px;border-radius:50%;background:#9be6f7;border:1px solid #06202c;box-shadow:0 0 6px #4cc9e6}
.l.m.b{background:#5aa9ff}.l.m.r{background:#ff6a5f}
.l.m:hover{font-size:12px;padding:2px 7px;width:auto;height:auto;border-radius:6px;background:#0b1c28;border:1px solid #9be6f7;z-index:3}
#vc:has(#vt.fm) #vpv,#vc:has(#vt.fm) #vnx{display:none}
#vt.fm{flex:1 1 auto;min-width:0;max-width:min(520px,52vw);gap:2px}#vt.fm b{flex:1 1 0;width:auto;min-width:2px;max-width:16px}
#ui{z-index:2;position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));font-size:13px;background:#000a;padding:8px 10px;border-radius:8px}
#ui button{margin:4px 4px 0 0;padding:5px 9px;border:0;border-radius:6px;background:#2a4a63;color:#fff}

#ui .va{background:#1f8aa8;font-weight:700}
#va{position:fixed;inset:0;pointer-events:none;display:none;z-index:20;--cy:#9be6f7;--tb:calc(max(44px,7vh) + env(safe-area-inset-top,0px));--bb:calc(max(60px,9vh) + env(safe-area-inset-bottom,0px))}

#va.on .lb.t{height:var(--tb)}#va.on .lb.b{height:var(--bb);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}

#va.on #vh{opacity:1}

#vh span{margin-left:14px;opacity:.7}
@keyframes vb{50%{opacity:.15}}

#vc button{border:1px solid #9be6f755;background:#0b1c28;color:#dff6fb;border-radius:8px;min-width:40px;height:36px;padding:0 10px;font-size:14px;cursor:pointer}

#vt{display:flex;gap:4px;align-items:center;margin:0 6px}
#vt b{width:clamp(8px,2.2vw,26px);height:6px;border-radius:3px;background:#27475a;cursor:pointer;transition:background .3s}
#vt b.d{background:#4f93aa}#vt b.a{background:var(--cy);box-shadow:0 0 8px var(--cy)}
#vsv{position:absolute;inset:0;width:100%;height:100%}

#vrt:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--cy)}
@keyframes vp{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.25);opacity:.2}}
#vbox{position:absolute;right:4vw;top:calc(var(--tb) + 4vh);width:min(430px,36vw);box-sizing:border-box;border:3px solid #8fdcf0;background:rgba(8,20,32,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:12px 16px 14px;color:var(--cy);font-weight:700;text-shadow:0 1px 3px #000;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}

#vbox .vtt{font-size:14px;margin:4px 0 8px;color:#fff}

#vbox .b{color:transparent;text-shadow:none}

#ui .fp{background:#3f9a54;font-weight:700}
#ui button{transition:box-shadow .22s ease,transform .12s ease,filter .22s ease}

#um{display:none;margin-top:4px}#um.open{display:block}#ui #ut{margin:0}#ui .va{margin:0 0 0 4px}

#cl{display:none}#cl.open{display:inline}
body.fpp #ui,body.fpp .l{display:none!important}
#fp{position:fixed;inset:0;pointer-events:none;display:none;z-index:15;font-family:ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 1px 2px #000;-webkit-user-select:none;user-select:none}

#fp .ch{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;mix-blend-mode:difference}

{const sm=Math.min(4096,R.capabilities.maxTextureSize),sc=sun.shadow.camera;sun.shadow.mapSize.set(sm,sm);sc.left=-78;sc.right=78;sc.top=78;sc.bottom=-78;sc.near=10;sc.far=220;sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.06;sun.shadow.radius=2.5}
